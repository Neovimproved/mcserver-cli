[package]
name = "mcserver"
version = "0.2.4"
edition = "2024"
description = "A command line interface that simplifies minecraft server management with zellij and mcrcon"
license = "MIT"
repository = "https://github.com/Neovimproved/mcserver-cli"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
clap_complete = "4.6.9"
dirs = "6.0.0"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
url = "2.5.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
shellexpand = "3.1.2"
color-eyre = { version = "0.6.5" }
thiserror = "2.0.20"
kdl = "6.7.1"

[build-dependencies]
color-eyre = "0.6.5"

[dev-dependencies]
tempfile = "3.27.0"

[features]
build-logging = []
